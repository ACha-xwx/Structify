        clearSmtpPassword: {type: boolean, description: Explicitly remove the stored SMTP password when true.}
        fromEmail: {type: string, format: email, maxLength: 254}
        fromName: {type: string, minLength: 1, maxLength: 128}
        connectionTimeoutSeconds: {type: integer, minimum: 1, maximum: 30}
        verificationTtlMinutes: {type: integer, minimum: 1, maximum: 60}
        resendIntervalSeconds: {type: integer, minimum: 5, maximum: 3600}
        sessionTtlDays: {type: integer, minimum: 1, maximum: 90}
        verificationSubject: {type: string, minLength: 1, maxLength: 300}
        verificationTemplateHtml: {type: string, minLength: 1, maxLength: 100000}
    MailConnectionTest:
