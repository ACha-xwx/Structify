openapi: 3.0.3
info:
  title: Data Structure Agent API
  version: 1.0.0
  description: Spring backend contract for the data structure learning agent.
servers:
  - url: /api/v1
    description: Relative base; usable from structify.cn and admin.structify.cn. Admin routes still require a database-backed ADMIN role.
security: []
tags:
  - name: Auth
  - name: Resources
  - name: Knowledge
  - name: Chat
  - name: Classroom
  - name: Animation
  - name: Code
  - name: Learning
  - name: AI
  - name: Admin
paths:
  /studyroom-runs/{id}/fragments/{fragmentId}/lecture:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {name: fragmentId, in: path, required: true, schema: {type: string}}
      - {name: contentRevision, in: query, required: true, schema: {type: integer, minimum: 1}}
    get:
      tags: [Classroom]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Compile bounded lecture cues from the current owned published fragment, without model calls
      responses:
        '200':
          description: Deterministic script; the browser owns playback, speech and pause. CHECK waits for explicit student action.
          content:
            application/json:
              schema:
                type: object
                required: [runId, fragmentId, contentRevision, fingerprint, cues, regions]
                properties:
                  runId: {type: string}
                  fragmentId: {type: string}
                  contentRevision: {type: integer}
                  fingerprint: {type: string}
                  cues: {type: array, maxItems: 160, items: {$ref: '#/components/schemas/LectureCue'}}
                  regions: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/LectureRegion'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Missing or foreign run or fragment}
        '409': {description: Superseded run, unpublished fragment or changed content revision}
  /studyroom-runs/{id}/fragments/{fragmentId}/lecture/regions:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {name: fragmentId, in: path, required: true, schema: {type: string}}
    post:
      tags: [Classroom]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Save an image-relative lecture region for a currently bound PPT resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentRevision, region]
              properties:
                contentRevision: {type: integer, minimum: 1}
                region: {$ref: '#/components/schemas/LectureRegion'}
      responses:
        '200':
          description: Saved region; an identical client ID and body replays without duplication
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LectureRegion'}
        '400': {description: Invalid normalized geometry or narration}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Missing or foreign run or fragment}
        '409': {description: Stale revision, unbound resource, ID conflict or region budget exhausted}
  /studyroom-runs/{id}/fragments/{fragmentId}/lecture/regions/{regionId}:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {name: fragmentId, in: path, required: true, schema: {type: string}}
      - {name: regionId, in: path, required: true, schema: {type: string}}
      - {name: contentRevision, in: query, required: true, schema: {type: integer, minimum: 1}}
    delete:
      tags: [Classroom]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Tombstone an owned current-revision lecture region
      responses:
        '200': {description: Region removed or already absent; no learning progress change}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Missing or foreign run or fragment}
        '409': {description: Superseded run or changed content revision}
  /study-outlines/{id}/events:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {$ref: '#/components/parameters/EventCursor'}
    get:
      tags: [Classroom]
      summary: Resume owned outline events without starting generation
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ClassroomEvents'}
        '400': {description: Invalid cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent, deleted or foreign draft}
  /studyroom-runs/{id}/events:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {$ref: '#/components/parameters/EventCursor'}
    get:
      tags: [Classroom]
      summary: Resume verified preparation and publication events
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ClassroomEvents'}
        '400': {description: Invalid cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent, deleted or foreign run}
  /study-rooms/{id}/messages/{questionId}:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {$ref: '#/components/parameters/QuestionId'}
    get:
      tags: [Classroom]
      summary: Read an owned question snapshot and partial answer
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Question state; GET never retries a model call
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassroomQuestion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent, deleted or foreign question}
  /study-rooms/{id}/messages/{questionId}/events:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {$ref: '#/components/parameters/QuestionId'}
      - {$ref: '#/components/parameters/EventCursor'}
    get:
      tags: [Classroom]
      summary: Resume an answer stream; disconnect does not cancel generation
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ClassroomEvents'}
        '400': {description: Invalid cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent, deleted or foreign question}
  /study-rooms/{id}/messages/{questionId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {$ref: '#/components/parameters/QuestionId'}
    post:
      tags: [Classroom]
      summary: Explicitly cancel a question idempotently; preserve consumed usage
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Authoritative terminal state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassroomQuestion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent, deleted or foreign question}
  /studyroom-runs/{id}/knowledge-points/{unitId}/checks:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {name: unitId, in: path, required: true, schema: {type: string}}
    post:
      tags: [Classroom]
      summary: Explicitly prepare checks within a separate bounded generation job
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      responses:
        '202': {description: Check preparation accepted; published lesson is retained}
        '400': {description: Missing or invalid idempotency key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent or foreign knowledge point}
        '409': {description: Material is not ready or another preparation is active}
    get:
      tags: [Classroom]
      summary: Read current knowledge-point checks without answer keys
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Ready questions or preparation state
          content:
            application/json:
              schema:
                type: object
                required: [status, questions, attempts]
                properties:
                  status: {type: string, enum: [PENDING, READY, FAILED]}
                  questions: {type: array, items: {$ref: '#/components/schemas/ClassroomCheck'}}
                  attempts: {type: array, items: {$ref: '#/components/schemas/CheckAttempt'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent or foreign knowledge point}
  /studyroom-runs/{id}/checks/{checkId}/attempts:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {name: checkId, in: path, required: true, schema: {type: string}}
    post:
      tags: [Classroom]
      summary: Grade a current check on the server; retain independent attempts
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selectedOption, contentRevision]
              properties:
                selectedOption: {type: string}
                contentRevision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Idempotent grading result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckAttempt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent, deleted or foreign check}
        '409': {description: Superseded run, changed content revision or idempotency conflict}
  /users/courses:
    get:
      tags: [Learning]
      summary: List the current user's visible outline drafts and current courses by recent user activity
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Owned courses; background generation does not change activity order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PersonalCourse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /users/courses/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: Owned outline draft ID}
    patch:
      tags: [Learning]
      summary: Rename a course display title without changing its outline or progress
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string, minLength: 1, maxLength: 160}
      responses:
        '204': {description: Display title saved}
        '400': {description: Blank or oversized title}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Course not found or not owned}
    delete:
      tags: [Learning]
      summary: Hide an owned course and revoke related preparation jobs; preserve quota and revision history
      description: Idempotent for an already deleted owned draft. An unconfirmed revision removes only that draft. A confirmed course hides all drafts of its room, hides associated saved steps and revokes queued/running job leases.
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '204': {description: Course removed from library}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Course not found or not owned}
  /study-outlines:
    post:
      tags: [Classroom]
      summary: Queue an outline only; no lesson body is generated before confirmation
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, depth]
              properties:
                question: {type: string, minLength: 1, maxLength: 4000}
                depth: {$ref: '#/components/schemas/LearningDepth'}
                chapterId: {type: string, maxLength: 64}
                sourceRoomId: {type: string, maxLength: 36}
      responses:
        '202': {description: Draft ID; poll the owned draft}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Idempotency payload conflict}
  /study-outlines/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Classroom]
      summary: Read an owned draft, latest valid outline, issues, immutable revision history and generation status
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Draft state; reading never starts generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutlineDraft'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Draft absent or owned by another user}
  /study-outlines/{id}/revisions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      tags: [Classroom]
      summary: Queue a revised outline while retaining the last valid version
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision, feedback]
              properties:
                baseRevision: {type: integer, minimum: 1}
                feedback: {type: string, minLength: 1, maxLength: 4000}
                depth: {$ref: '#/components/schemas/LearningDepth'}
      responses:
        '202': {description: Operation accepted; repeated keys return the same result}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Draft absent or foreign}
        '409': {description: Stale revision, generation pending, unavailable required material or idempotency conflict}
  /study-outlines/{id}/confirm:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      tags: [Classroom]
      summary: Freeze the latest reviewed outline and queue the first unit
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Operation accepted; repeated keys return the same result}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Draft absent or foreign}
        '409': {description: Stale revision, generation pending, unavailable required material or idempotency conflict}
  /study-outlines/{id}/restore:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      tags: [Classroom]
      summary: Copy a historical outline into a new immutable revision
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision, targetRevision]
              properties:
                baseRevision: {type: integer, minimum: 1}
                targetRevision: {type: integer, minimum: 1}
      responses:
        '200': {description: Operation accepted; repeated keys return the same result}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Draft absent or foreign}
        '409': {description: Stale revision, generation pending, unavailable required material or idempotency conflict}
  /study-outlines/{id}/retry:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      tags: [Classroom]
      summary: Explicitly retry failed generation; an uncertain prior call may have consumed quota
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      responses:
        '202': {description: Operation accepted; repeated keys return the same result}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Draft absent or foreign}
        '409': {description: Stale revision, generation pending, unavailable required material or idempotency conflict}
  /study-rooms/{id}/run:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Classroom]
      summary: Read owned current learning run and unit preparation states without generation
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Current run snapshot with knowledge points, fragments and first readable fragment}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Run absent or foreign}
  /studyroom-runs/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Classroom]
      summary: Read owned current learning run and unit preparation states without generation
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Current run snapshot with knowledge points, fragments and first readable fragment}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Run absent or foreign}
  /studyroom-runs/{id}/focus:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
    post:
      tags: [Classroom]
      summary: Focus one knowledge point using a monotonic navigation sequence
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitId, sequence]
              properties:
                unitId: {type: string, maxLength: 36}
                sequence: {type: integer, minimum: 1}
      responses:
        '200': {description: Current stateVersion; older focus sequences cannot replace newer navigation}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent or foreign current run}
        '409': {description: Invalid knowledge point or conflicting idempotency payload}
  /studyroom-runs/{id}/progress:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
    post:
      tags: [Classroom]
      summary: Save an owned published fragment position or explicit knowledge-point completion
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitId, fragmentId]
              properties:
                unitId: {type: string, maxLength: 36}
                fragmentId: {type: string, maxLength: 36}
                completed: {type: boolean, default: false}
      responses:
        '200': {description: Saved stateVersion; quiz grading never invokes this operation}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent or foreign current run}
        '409': {description: Fragment not ready, mismatched knowledge point or incomplete reading}
  /studyroom-runs/{id}/fragments/{fragmentId}/retry:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {name: fragmentId, in: path, required: true, schema: {type: string}}
    post:
      tags: [Classroom]
      summary: Explicitly retry a failed fragment within its retained generation budget
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      responses:
        '202': {description: Queued jobId}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent or foreign fragment}
        '409': {description: Active generation, ready fragment or exhausted retained budget}
  /studyroom-runs/{id}/fragments/{fragmentId}/regenerate:
    parameters:
      - {$ref: '#/components/parameters/ClassroomId'}
      - {name: fragmentId, in: path, required: true, schema: {type: string}}
    post:
      tags: [Classroom]
      summary: Explicitly create a new fragment content revision while retaining published content
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseContentRevision]
              properties:
                baseContentRevision: {type: integer, minimum: 0}
      responses:
        '202': {description: Queued jobId for a new content revision}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Absent or foreign fragment}
        '409': {description: Content revision changed or generation already active}
  /study-rooms/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Classroom]
      summary: Read an owned lesson; legacy records receive a scene adapter
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Owned lesson
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudyroomView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Lesson does not exist or belongs to another user}
  /study-rooms/{id}/messages:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      tags: [Classroom]
      summary: Queue one idempotent question against the current published material
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, runId, fragmentId, contentRevision]
              properties:
                question: {type: string, minLength: 1, maxLength: 4000}
                runId: {type: string}
                fragmentId: {type: string}
                contentRevision: {type: integer, minimum: 1}
                context:
                  type: object
                  required: [stepId, sceneId]
                  properties:
                    stepId: {type: string, maxLength: 64}
                    sceneId: {type: string, maxLength: 160}
                    resourceId: {type: string, maxLength: 160}
                    codeMode: {type: string, enum: [READ, EXPERIMENT]}
                    runResult:
                      type: object
                      properties:
                        stdout: {type: string, maxLength: 4000}
                        stderr: {type: string, maxLength: 4000}
      responses:
        '202':
          description: Existing or newly queued question; at most one active question per user and run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Lesson does not exist or belongs to another user}
  /study-rooms/{id}/progress:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Classroom]
      summary: Save the selected step; does not imply mastery or persist slide/editor state
      security: [{bearerAuth: []}, {cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stepId]
              properties:
                stepId: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Saved progress
          content:
            application/json:
              schema:
                type: object
                required: [currentStepId, version, updatedAt]
                properties:
                  currentStepId: {type: string}
                  version: {type: integer, description: Optimistic room revision, distinct from orchestration schemaVersion}
                  updatedAt: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Room or step is not owned by this user}
  /auth/request-code:
    post:
      tags: [Auth]
      summary: Request an email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCodeRequest'
      responses:
        '200':
          description: Generic delivery response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCodeDelivery'
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a verified account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Authenticated account; also sets the HttpOnly session cookie
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email or username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated account; also sets the HttpOnly session cookie
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie
      responses:
        '204': {description: Session cookie cleared}
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a password with a reset-purpose verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
