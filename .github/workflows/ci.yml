name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    name: Legacy prototype regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test scripts/verify-studyroom.test.mjs
      - run: node scripts/verify-studyroom.mjs --scope contracts
      - run: node scripts/verify-backend-layout.js
      - run: node scripts/verify-frontend-layout.js
      - run: node scripts/verify-core-regression.js
      - run: git diff --check

  frontend:
    name: Frontend tests, types, and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify frontend tests, types, and build
        run: node scripts/verify-studyroom.mjs --scope frontend
      - name: Verify production artifact integrity
        run: node scripts/verify-frontend-build-artifact.js

  spring-backend:
    name: Spring backend tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven wrapper executable
        working-directory: backend/spring
        run: chmod +x mvnw
      - name: Run tests
        run: node scripts/verify-studyroom.mjs --scope backend
      - name: Package application
        working-directory: backend/spring
        run: ./mvnw -B -DskipTests package

  studyroom-browser:
    name: Studyroom browser harness
    needs: [frontend, spring-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: chmod +x backend/spring/mvnw
      - run: node scripts/verify-studyroom.mjs --scope e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: studyroom-browser-failure
          path: frontend/test-results/playwright/
          retention-days: 7

  node-image:
    name: Node image build gate
    needs: [frontend, prototype]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Node compatibility image
        run: docker build --file deployment/Dockerfile.node --tag ds-agent-node:ci .
