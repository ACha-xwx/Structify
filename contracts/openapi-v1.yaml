              schema: {$ref: '#/components/schemas/DsvpRequest'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /animations/plan:
    post:
      tags: [Animation]
      summary: Turn an explicitly chosen capability and its arguments into an executable DSVP request
      description: >-
        The animation lab's deterministic path. The caller has already decided which capability to show,
        so no model is consulted and no token quota is consumed; the local engine validates the arguments,
        fills in its canonical teaching example when they are missing, and returns the request that
        /animations/simulate can execute. A capability outside the reviewed catalog is rejected rather
        than guessed at.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability]
              properties:
                capability: {type: string, minLength: 1, maxLength: 64, example: 'bst.insert'}
                arguments:
                  type: object
                  description: Capability arguments; a missing required argument falls back to the engine's canonical example, reported as toolRequest.demoFallback.
                sourceRef: {type: string, maxLength: 160}
      responses:
        '200':
          description: Resolution carrying the engine-built request when the status is `ready`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DsvpPlanResolution'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
