        smtpHost: {type: string, maxLength: 253}
        smtpPort: {type: integer, minimum: 1, maximum: 65535}
        securityMode: {type: string, enum: [NONE, STARTTLS, SSL]}
        smtpUsername: {type: string, maxLength: 320}
        smtpPasswordConfigured: {type: boolean, description: Indicates that an encrypted password is stored; the password itself is never returned.}
        fromEmail: {type: string, format: email, maxLength: 254}
        fromName: {type: string, maxLength: 128}
        connectionTimeoutSeconds: {type: integer, minimum: 1, maximum: 30}
        verificationTtlMinutes: {type: integer, minimum: 1, maximum: 60}
        resendIntervalSeconds: {type: integer, minimum: 5, maximum: 3600}
        sessionTtlDays: {type: integer, minimum: 1, maximum: 90}
        verificationSubject: {type: string, maxLength: 300}
        verificationTemplateHtml: {type: string, maxLength: 100000}
        lastConnectionTestStatus: {type: string, nullable: true}
        lastConnectionTestedAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
    UpdateMailConfigRequest:
      type: object
      required:
