      type: object
      required: [provider, baseUrl, model]
      properties:
        provider: {type: string, minLength: 1, maxLength: 128}
        baseUrl: {type: string, format: uri, minLength: 1, maxLength: 2048}
        model: {type: string, minLength: 1, maxLength: 512}
        apiKey:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Required for a new provider or base URL. Never returned or logged.
        temperature: {type: number, minimum: 0, maximum: 2}
        maxOutputTokens: {type: integer, minimum: 1, maximum: 32768}
        requestTimeoutMs: {type: integer, format: int64, minimum: 1000, maximum: 120000}
        retryCount: {type: integer, minimum: 0, maximum: 5}
        dailyTokenQuota: {type: integer, format: int64, minimum: 0, maximum: 10000000}
        enabled: {type: boolean}
    ModelConfigConnectionTest:
      type: object
      required: [connected, code]
      properties:
        connected: {type: boolean}
        code:
          type: string
          pattern: '^[A-Z0-9_]{1,64}$'
          description: Controlled result code. CONNECTION_OK requires a 2xx OpenAI-compatible chat-completion envelope (a non-empty choices array whose first entry carries a message object), so a reasoning model that returns reasoning_content or an empty content under the capped probe is still reported as connected; CONNECTION_RESPONSE_INVALID means a 2xx response failed that shape check. Other standard outcomes are CONNECTION_FAILED, REDIRECT_REJECTED, UPSTREAM_REJECTED, and the actionable upstream rejections UPSTREAM_AUTHENTICATION_REJECTED (401/403), UPSTREAM_PAYMENT_REQUIRED (402), and UPSTREAM_RATE_LIMITED (429).
    MailConfigCapability:
      type: object
      required: [available]
      properties:
        available: {type: boolean}
        reason:
          type: string
          nullable: true
          enum: [MASTER_KEY_UNAVAILABLE, MAIL_CONFIG_UNAVAILABLE]
        configuration:
          allOf: [{$ref: '#/components/schemas/MailConfig'}]
          nullable: true
