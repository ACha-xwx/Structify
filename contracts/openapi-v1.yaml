  /learning/events:
    post:
      tags: [Learning]
      summary: Record an authenticated student's reviewed learning activity
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LearningEventRequest'}
      responses:
        '201':
          description: Learning activity recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LearningEvent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
  /ai/readiness:
    get:
      tags: [AI]
      summary: Return authenticated generation readiness without calling a model
      description: >-
        The result is derived from the current server-side model configuration and only
        verified, authorized evidence with a complete source chain. `operation` defaults to `CHAT`; `CHAT`
        requires eligible evidence, while `CODE_ANALYSIS` and
        `ANIMATION_GENERATION` do not. A false allowFormalGeneration value must be
        treated as a hard server-side generation gate. Unsupported operation values
        return HTTP 400 with code `AI_READINESS_OPERATION_INVALID`.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - name: operation
          in: query
          required: false
          description: Canonical generation operation. Omission defaults to CHAT. A supplied value must be non-blank, at most 64 characters, and match CHAT, CODE_ANALYSIS, or ANIMATION_GENERATION after case and hyphen normalization.
          schema: {type: string, minLength: 1, maxLength: 64, pattern: '.*\\S.*', enum: [CHAT, CODE_ANALYSIS, ANIMATION_GENERATION], default: CHAT}
        - name: chapterId
          in: query
          required: false
          description: Optional evidence scope. When supplied it must be non-blank and at most 64 characters.
          schema: {type: string, minLength: 1, maxLength: 64, pattern: '.*\\S.*'}
        - name: prompt
          in: query
          required: false
          description: Optional evidence query. When supplied it must be non-blank and at most 4000 characters.
          schema: {type: string, minLength: 1, maxLength: 4000, pattern: '.*\\S.*'}
      responses:
        '200':
          description: Current readiness and non-sensitive blocking reasons
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiReadiness'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/capabilities:
    get:
      tags: [Admin]
      summary: Return the current administrator's available management modules
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Capability map based on the current database role
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCapability'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/users:
    get:
      tags: [Admin]
      summary: Search and paginate users without credentials or private content
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: search
          in: query
          required: false
          schema: {type: string, maxLength: 128}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [ACTIVE, DISABLED]}
        - name: role
          in: query
          required: false
          schema: {type: string, enum: [STUDENT, TEACHER, ADMIN]}
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/users/{id}:
    get:
      tags: [Admin]
      summary: Return a safe administrator view of one user
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AdminUserId'}
      responses:
        '200':
          description: User detail without password hashes, verification codes, tokens, or private resources
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/users/{id}/status:
    patch:
      tags: [Admin]
      summary: Enable or disable a user and create an audit event
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AdminUserId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserStatusRequest'}
      responses:
        '200':
          description: Updated user state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/users/{id}/roles:
    patch:
      tags: [Admin]
      summary: Replace a user's role set under server-side safeguards and audit it
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AdminUserId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserRolesRequest'}
      responses:
        '200':
          description: Updated role set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/users/{id}/learning:
    get:
      tags: [Admin]
      summary: The learning footprint of one account, gathered in a single audited read
      description: Courses, bookmarks, classroom work, tokens spent in the last 30 days, recent generation jobs and the mastery map. Every call writes an ADMIN_VIEW_LEARNING_MAP audit event.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AdminUserId'}
      responses:
        '200':
          description: The learning footprint
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserLearning'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/audit-events:
    get:
      tags: [Admin]
      summary: Query non-sensitive administrator audit events
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - name: size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: actorUserId
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 1}
        - name: action
          in: query
          required: false
          schema: {type: string, maxLength: 64}
        - name: targetType
          in: query
          required: false
          schema: {type: string, maxLength: 64}
        - name: targetId
          in: query
          required: false
          schema: {type: string, maxLength: 160}
        - name: from
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Audit event page with request IDs and state summaries only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminAuditEventPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/background-tasks:
    get:
      tags: [Admin]
      summary: List durable background task records
      description: >-
        The current writable task surface supports only `STALE_TASK_RECOVERY`.
        The ledger may still expose pre-existing records with another well-formed
        type, but retry and cancel reject them.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELED]}
        - name: taskType
          in: query
          required: false
          description: Filter a stored task type. `STALE_TASK_RECOVERY` is the only currently submitted and executable task type.
          schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$'}
      responses:
        '200':
          description: Task ledger page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackgroundTaskPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/background-tasks/{id}:
    get:
      tags: [Admin]
      summary: Return one durable background task record
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/BackgroundTaskId'}
      responses:
        '200':
          description: Task lifecycle, deadline, failure, retry, and request metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackgroundTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/background-tasks/recover-timeouts:
    post:
      tags: [Admin]
      summary: Submit the only supported timeout-recovery task and return its durable record
      description: Creates a `STALE_TASK_RECOVERY` task. It marks expired pending or running work as failed; terminal success reports the affected count in `resultCount`.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '202':
          description: Recovery submitted for asynchronous execution; terminal success records the recovered task count
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackgroundTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/background-tasks/{id}/retry:
    post:
      tags: [Admin]
      summary: Retry an eligible failed stale-task-recovery record
      description: Only a failed `STALE_TASK_RECOVERY` record below its attempt limit can be retried. Other task types return HTTP 409.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/BackgroundTaskId'}
      responses:
        '202':
          description: Retry submitted for asynchronous execution
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackgroundTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/background-tasks/{id}/cancel:
    post:
      tags: [Admin]
      summary: Cancel a pending stale-task-recovery record
      description: Only a pending `STALE_TASK_RECOVERY` record can be canceled. Other task types return HTTP 409.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/BackgroundTaskId'}
      responses:
        '200':
          description: Canceled task record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackgroundTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/reviews:
    get:
      tags: [Admin]
      summary: List reviewable learning resources and evidence
      description: >-
        The review domain contains only `RESOURCE`, `KNOWLEDGE_CHUNK`,
        `PRESENTATION_MANIFEST`, `PRESENTATION_PAGE`, and
        `DSVP_REQUEST_SNAPSHOT`. DSVP snapshots are reviewable only when
        `source_type=PPT` and their source reference resolves through a
        presentation page and manifest. Classroom scripts, animation
        observations, and non-PPT DSVP snapshots are outside this review and
        VERIFIED domain.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: type
          in: query
          required: false
          description: A comma-separated subset of ReviewType values
          schema: {type: string, maxLength: 256}
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/ReviewStatus'}
        - name: search
          in: query
          required: false
          schema: {type: string, maxLength: 160}
      responses:
        '200':
          description: Review queue page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewItemPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/reviews/{type}/{id}:
    get:
      tags: [Admin]
      summary: Return one review item with its safe source chain
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ReviewType'}
        - {$ref: '#/components/parameters/ReviewId'}
      responses:
        '200':
          description: Review item and safe source-chain metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/reviews/{type}/{id}/status:
    patch:
      tags: [Admin]
      summary: Change review status and audit the transition
      description: A VERIFIED transition is rejected when its source chain is not complete and VERIFIED. The linked chapter must also be PUBLISHED.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ReviewType'}
        - {$ref: '#/components/parameters/ReviewId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewStatusRequest'}
      responses:
        '200':
          description: Updated review item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewItem'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/reviews/{type}/{id}/history:
    get:
      tags: [Admin]
      summary: Return the status history for a review item
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ReviewType'}
        - {$ref: '#/components/parameters/ReviewId'}
      responses:
        '200':
          description: Transition history with reviewer and request ID
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ReviewHistoryEvent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/model-config:
    get:
      tags: [Admin]
      summary: Read provider-neutral model configuration capability without a credential
      description: >-
        `available` represents generation eligibility, not merely whether a saved
        encrypted credential can be read. A readable configuration can therefore be
        returned with `available=false` when it is disabled or has no positive daily
        quota.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Module availability and a credential-free configuration view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelConfigCapability'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Admin]
      summary: Save provider-neutral model controls and audit the change
      description: >-
        apiKey is accepted only by this write endpoint. It is encrypted at rest and is
        never returned. A provider or base URL change requires a newly supplied key.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateModelConfigRequest'}
      responses:
        '200':
          description: Safe persisted configuration view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelConfig'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/sandbox-config:
    get:
      tags: [Admin]
      summary: Read the configured code execution sandbox capability
      description: >-
        Returns a credential-free view of the persisted sandbox target. A disabled
        or missing configuration is reported as unavailable and execution remains
        fail-closed. Supported providers are PISTON and JUDGE0.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Sandbox capability and safe configuration view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SandboxConfigCapability'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Admin]
      summary: Save and enable or disable the code execution sandbox
      description: >-
        Saves a validated HTTPS service URL (local HTTP is allowed only in dev/test),
        resets prior connection evidence, and records an administrative audit event.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSandboxConfigRequest'}
      responses:
        '200':
          description: Safe persisted sandbox configuration view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SandboxConfig'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/sandbox-config/test:
    post:
      tags: [Admin]
      summary: Probe the saved sandbox connection
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Non-sensitive connection result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SandboxConnectionTest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/model-config/test:
    post:
      tags: [Admin]
      summary: Test the saved model connection under SSRF and redirect safeguards
      description: >-
        Uses the saved configuration and sends no caller-supplied body. The service
        makes a pinned HTTPS `POST` to the resolved base URL plus
        `/chat/completions`, with an OpenAI-compatible JSON request containing the
        saved model, one `Connection test` user message, `max_tokens: 1`,
        `temperature: 0`, and `stream: false`. A 2xx response succeeds only when it
        contains a non-blank `choices[0].message.content`; another 2xx response
        yields `CONNECTION_RESPONSE_INVALID`. Redirects are rejected and never
        followed. The persisted result and timestamp are diagnostic history only;
        they do not make a model available and are not consulted as a generation
        readiness gate.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Non-sensitive connection result; a false result does not expose upstream details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelConfigConnectionTest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/mail-config:
    get:
      tags: [Admin]
      summary: Read the credential-free SMTP delivery and authentication policy configuration
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Mail capability and safe configuration view; the SMTP password is never returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailConfigCapability'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Admin]
      summary: Save SMTP delivery, verification-code, session, and template settings
      description: >-
        smtpPassword is accepted only by this write endpoint, encrypted at rest, and
        never returned. Leave it blank to preserve the current credential; set
        clearSmtpPassword to true to remove it explicitly.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMailConfigRequest'}
      responses:
        '200':
          description: Safe persisted mail configuration view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailConfig'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/mail-config/test-connection:
    post:
      tags: [Admin]
      summary: Test an unsaved SMTP configuration without persisting it
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMailConfigRequest'}
      responses:
        '200':
          description: Non-sensitive SMTP connection result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailConnectionTest'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/mail-config/test-email:
    post:
      tags: [Admin]
      summary: Send a rendered draft verification email to the current administrator only
      description: The recipient must match the authenticated administrator email; arbitrary test recipients are rejected.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TestMailRequest'}
      responses:
        '200':
          description: Non-sensitive test delivery result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestMailResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/classes:
    get:
      tags: [Admin]
      summary: List every class with its student count and teachers
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Classes, newest first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AdminClass'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      summary: Create an empty class
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateClassRequest'}
      responses:
        '201':
          description: The created class
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminClass'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/classes/{classId}:
    delete:
      tags: [Admin]
      summary: Delete a class and its enrolments
      description: Learning records belong to the learner, not to the class, so they are untouched.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/classes/{classId}/members:
    get:
      tags: [Admin]
      summary: List the people enrolled in a class
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
      responses:
        '200':
          description: Enrolled people, teachers first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AdminClassMember'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Admin]
      summary: Enrol a person found by email or username
      description: Adding somebody as a teacher is what lets them read those learners, so it is an administrator action.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddClassMemberRequest'}
      responses:
        '201':
          description: The enrolment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminClassMember'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/classes/{classId}/members/{userId}:
    delete:
      tags: [Admin]
      summary: Remove a person from a class, which withdraws their access to its learners
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
        - {$ref: '#/components/parameters/ClassUserId'}
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/observability/jobs:
    get:
      tags: [Admin]
      summary: Both job ledgers (background tasks and studyroom generation) merged into one page
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {name: source, in: query, required: false, schema: {type: string, enum: [BACKGROUND, STUDYROOM]}}
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: userId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
      responses:
        '200':
          description: Jobs newest first; source says which ledger a row came from
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminJobPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/observability/cost:
    get:
      tags: [Admin]
      summary: Tokens actually spent between two days, grouped by day or by user
      description: Only settled reservations count; a reservation that never completed is not a cost.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: groupBy, in: query, required: false, schema: {type: string, enum: [DAY, USER], default: DAY}}
      responses:
        '200':
          description: The cost report, default window the last 30 days
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCostReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/observability/modules:
    get:
      tags: [Admin]
      summary: Availability and live counts for the studyroom, learning and quota modules
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: One entry per module with the counters an operator watches
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AdminModuleState'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/knowledge/overview:
    get:
      tags: [Admin]
      summary: Knowledge corpus counts and the size of the live retrieval snapshot
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Totals by review status and source bucket, plus the snapshot the search actually reads
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKnowledgeOverview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/knowledge/settings:
    get:
      tags: [Admin]
      summary: The retrieval tuning in effect, and whether it is a saved override or the defaults
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Current settings, the customized flag, and the configuration defaults
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKnowledgeSettingsView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Admin]
      summary: Save the retrieval tuning; the next search uses it without a restart
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveKnowledgeSettingsRequest'}
      responses:
        '200':
          description: The settings now in effect
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKnowledgeSettingsView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      tags: [Admin]
      summary: Drop the saved tuning row so the configuration defaults apply again
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: The settings now in effect (the defaults)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKnowledgeSettingsView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/knowledge/test-search:
    post:
      tags: [Admin]
      summary: Run the retrieval pipeline with explicit tuning, without saving anything
      description: Eligibility and license checks still apply; only the matching knobs are overridden.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminKnowledgeTestSearchRequest'}
      responses:
        '200':
          description: The effective settings and the hits they produced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKnowledgeTestSearchResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/knowledge/chunks:
    get:
      tags: [Admin]
      summary: Knowledge chunks, filtered and paged, each with its live retrievability flag
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: chapterId, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [DRAFT, PENDING, VERIFIED, REJECTED]}}
        - {name: sourcePrefix, in: query, required: false, schema: {type: string, description: 'Source bucket prefix such as textbook, courseware or admin'}}
        - {name: q, in: query, required: false, schema: {type: string, description: 'Free text over title and content'}}
      responses:
        '200':
          description: Newest chunks first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKnowledgeChunkPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      summary: Create a manual chunk under the admin/ source, where no import can overwrite it
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateKnowledgeChunkRequest'}
      responses:
        '201':
          description: The created chunk
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKnowledgeChunkDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/knowledge/chunks/{chunkId}:
    get:
      tags: [Admin]
      summary: One chunk with its full content and live retrievability
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/KnowledgeChunkId'}
      responses:
        '200':
          description: The chunk
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKnowledgeChunkDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Admin]
      summary: Edit a chunk; the retrieval snapshot rebuilds before the response returns
      description: Editing an import-owned chunk is allowed but the next import overwrites it.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/KnowledgeChunkId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchKnowledgeChunkRequest'}
      responses:
        '200':
          description: The chunk after the edit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKnowledgeChunkDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Admin]
      summary: Delete a chunk; retrieval stops quoting it immediately
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/KnowledgeChunkId'}
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /teacher/classes:
    get:
      tags: [Teacher]
      summary: Classes the caller teaches; an administrator sees every class
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Classes the caller may open
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TeacherClass'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /teacher/classes/{classId}/students:
    get:
      tags: [Teacher]
      summary: Cheap roster of one class, refused unless the caller teaches it
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ClassId'}
      responses:
        '200':
          description: One row per student with last activity and classroom steps, but no mastery map
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TeacherStudent'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /teacher/students/{studentId}/learning-map:
    get:
      tags: [Teacher]
      summary: The learning map of one student, the same computation the student sees
      description: Refused unless the caller teaches a class the student is enrolled in. Every successful read is audited.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/StudentId'}
      responses:
        '200':
          description: The student's mastery map
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LearningMap'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /teacher/students/{studentId}/footprint:
    get:
      tags: [Teacher]
      summary: One student's whole footprint for the teacher - courses, classroom work, bookmarks and the map
      description: One call, one audit row. Spend and generation jobs are deliberately not part of this view; they belong to the operations console.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/StudentId'}
      responses:
        '200':
          description: The student's learning footprint
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeacherStudentFootprint'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ds_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClassroomId:
      name: id
      in: path
      required: true
      schema: {type: string, maxLength: 64}
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: {type: string, maxLength: 64}
    EventCursor:
      name: since
      in: query
      schema: {type: integer, format: int64, minimum: 0, default: 0}
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
    PageSize:
      name: size
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    AdminUserId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    ClassId:
      name: classId
      in: path
      required: true
      schema: {type: string, maxLength: 36}
    ClassUserId:
      name: userId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    KnowledgeChunkId:
      name: chunkId
      in: path
      required: true
      schema: {type: string, maxLength: 96}
    StudentId:
      name: studentId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    BackgroundTaskId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    ReviewType:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum: [RESOURCE, KNOWLEDGE_CHUNK, PRESENTATION_MANIFEST, PRESENTATION_PAGE, DSVP_REQUEST_SNAPSHOT]
    ReviewId:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 160}
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema: {type: string, maxLength: 64}
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: {type: string, maxLength: 64}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, maxLength: 64}
    ChatSessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, maxLength: 64}
    AnimationId:
      name: animationId
      in: path
      required: true
      schema: {type: string, maxLength: 64}
  responses:
    ClassroomEvents:
      description: 'Owned persisted SSE events; id is the stream sequence. Expired or future cursors receive reset with an authoritative snapshot. Disconnect does not cancel a task or create a new model call.'
      content:
        text/event-stream:
          schema: {type: string}
    BadRequest:
      description: Invalid request
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    Unauthorized:
      description: Authentication required or credentials invalid
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    Forbidden:
      description: Authenticated user cannot access the requested source
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    NotFound:
      description: Resource not found or not visible to this user
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    Conflict:
      description: State conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    PayloadTooLarge:
      description: Input exceeds configured limit
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    TooManyRequests:
      description: Rate limit exceeded
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    BadGateway:
      description: Model or sandbox upstream failed
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    GatewayTimeout:
      description: Model or sandbox upstream timed out
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    ServiceUnavailable:
      description: A required local configuration or controlled dependency is unavailable
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    InternalServerError:
      description: Local evidence persistence failed and the transaction was rolled back
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
  schemas:
    LectureCue:
      type: object
      required: [id, kind, text]
      properties:
        id: {type: string}
        kind: {type: string, enum: [TEXT, PPT, ANIMATION, C_CODE, CHECK]}
        text: {type: string, maxLength: 240}
        sceneId: {type: string}
        resourceId: {type: string}
        action: {type: string, enum: [MATERIAL_FOCUS, PPT_REGION, CODE_HIGHLIGHT, ANIMATION_SEEK]}
        regionId: {type: string}
        startLine: {type: integer, minimum: 1}
        endLine: {type: integer, minimum: 1}
        stepIndex: {type: integer, minimum: 0}
    LectureRegion:
      type: object
      required: [id, sceneId, resourceId, x, y, width, height, narration]
      description: Explicit image-relative region; finite coordinates, x+width and y+height must not exceed one. No automatic OCR is implied.
      properties:
        id: {type: string, maxLength: 36}
        sceneId: {type: string, maxLength: 160}
        resourceId: {type: string, maxLength: 240}
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        width: {type: number, minimum: 0.01, maximum: 1}
        height: {type: number, minimum: 0.01, maximum: 1}
        narration: {type: string, minLength: 1, maxLength: 800}
    QuestionReceipt:
      type: object
      required: [questionId, status, streamId, cursor]
      properties:
        questionId: {type: string}
        status: {type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED]}
        streamId: {type: string}
        cursor: {type: integer, format: int64, minimum: 0}
    ClassroomQuestion:
      allOf:
        - {$ref: '#/components/schemas/QuestionReceipt'}
        - type: object
          required: [question, answer, context, runId, fragmentId, contentRevision]
          properties:
            question: {type: string}
            answer: {type: string, maxLength: 12000}
            context: {type: object, additionalProperties: true}
            runId: {type: string}
            fragmentId: {type: string}
            contentRevision: {type: integer, minimum: 1}
            error: {type: string, nullable: true}
    ClassroomCheck:
      type: object
      additionalProperties: false
      required: [id, unitId, contentRevision, prompt, options]
      properties:
        id: {type: string}
        unitId: {type: string}
        contentRevision: {type: integer, minimum: 1}
        prompt: {type: string}
        options:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
    CheckAttempt:
      type: object
      required: [id, checkId, selectedOption, correct, answerOption, analysis]
      properties:
        id: {type: string}
        checkId: {type: string}
        selectedOption: {type: string}
        correct: {type: boolean}
        answerOption: {type: string}
        analysis: {type: string}
    ReviewedOutline:
      type: object
      required: [schemaVersion, depth, title, objectives, prerequisites, units, excludedCoverageKeys, exclusions, evidenceIds, coverageAssessment]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        depth: {$ref: '#/components/schemas/LearningDepth'}
        title: {type: string, minLength: 1, maxLength: 160}
        objectives: {type: array, minItems: 1, maxItems: 12, items: {type: string, maxLength: 400}}
        prerequisites: {type: array, items: {type: string}}
        units: {type: array, minItems: 1, maxItems: 24, items: {$ref: '#/components/schemas/OutlineUnit'}}
        excludedCoverageKeys: {type: array, items: {type: string}}
        exclusions: {type: array, items: {type: string}}
        evidenceIds: {type: array, items: {type: string}}
        curriculumVersion: {type: string, nullable: true}
        coverageAssessment: {type: string, enum: [REVIEWED_FRAMEWORK, EVIDENCE_ONLY]}
    OutlineUnit:
      type: object
      required: [id, title, objective, coverageKeys, expansion, activities, materials]
      properties:
        id: {type: string, maxLength: 80}
        title: {type: string, maxLength: 160}
        objective: {type: string, maxLength: 400}
        coverageKeys: {type: array, minItems: 1, maxItems: 32, items: {type: string}}
        expansion: {type: string, enum: [INTRODUCE, EXPLAIN, PRACTICE]}
        activities: {type: array, minItems: 1, maxItems: 8, items: {type: string, enum: [CONCEPT, PROCESS, IMPLEMENTATION, EXPERIMENT, CHECK]}}
        materials:
          type: array
          maxItems: 9
          description: At most three purposes per material kind; candidate IDs are computed by the server
          items:
            type: object
            required: [kind, requirement, purpose, candidateIds, availability]
            properties:
              kind: {type: string, enum: [PPT, ANIMATION, C_CODE]}
              requirement: {type: string, enum: [REQUIRED, RECOMMENDED, OPTIONAL]}
              purpose: {type: string, maxLength: 200}
              candidateIds: {type: array, items: {type: string}}
              availability: {type: string, enum: [AVAILABLE, UNAVAILABLE, UNVERIFIED]}
    LearningDepth:
      type: string
      enum: [QUICK, STANDARD, DEEP]
    OutlineDraft:
      type: object
      required: [id, status, latestRevision, outline, issues, changes]
      properties:
        id: {type: string}
        status: {type: string, enum: [GENERATING, REVIEWABLE, FAILED, CONFIRMED]}
        latestRevision: {type: integer, minimum: 0}
        pendingJobId: {type: string, nullable: true}
        confirmedRunId: {type: string, nullable: true}
        confirmedRoomId: {type: string, nullable: true}
        sourceRoomId: {type: string, nullable: true}
        outline: {allOf: [{$ref: '#/components/schemas/ReviewedOutline'}], nullable: true}
        issues: {type: array, items: {type: object, description: code, unitId, severity BLOCKER or WARNING, message}}
        changes: {type: array, items: {type: object, description: unitId, kind ADDED or REMOVED or CHANGED or MOVED, summary}}
        revisions: {type: array, items: {type: object, description: immutable revision metadata}}
        messages: {type: array, items: {type: object, description: outline discussion only}}
    StudyroomScene:
      type: object
      required: [id, kind, purpose, items]
      properties:
        id: {type: string}
        kind: {type: string, enum: [TEXT, PPT, ANIMATION, C_CODE]}
        purpose: {type: string, maxLength: 200}
        items:
          type: array
          maxItems: 12
          description: Ordered pages for PPT; exactly one item for animation/code, none for TEXT
          items:
            type: object
            required: [resourceId, explanation]
            properties:
              resourceId: {type: string}
              explanation: {type: string, maxLength: 4000}
              startLine: {type: integer, minimum: 1, nullable: true}
              endLine: {type: integer, minimum: 1, nullable: true}
        codeMode: {type: string, enum: [READ, EXPERIMENT], nullable: true}
        task: {type: string, maxLength: 1000, nullable: true}
        stdin: {type: string, nullable: true}
        expectedObservation: {type: string, maxLength: 1000, nullable: true}
    StudyroomOrchestration:
      type: object
      required: [schemaVersion, objective, intent, primary, supplementary]
      properties:
        schemaVersion: {type: integer, enum: [2]}
        objective: {type: string, maxLength: 400}
        intent: {type: string, enum: [CONCEPT, PROCESS, IMPLEMENTATION, EXPERIMENT, CHECK]}
        primary: {$ref: '#/components/schemas/StudyroomScene'}
        supplementary:
          type: array
          maxItems: 2
          items: {$ref: '#/components/schemas/StudyroomScene'}
    StudyroomView:
      type: object
      required: [id, title, summary, version, steps, messages]
      properties:
        id: {type: string}
        chapterId: {type: string, nullable: true}
        title: {type: string}
        initialQuestion: {type: string}
        summary: {type: string}
        currentStepId: {type: string, nullable: true}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        steps:
          type: array
          items:
            type: object
            required: [id, stepKey, type, title, explanation, resources, orchestration]
            properties:
              id: {type: string}
              stepKey: {type: string}
              type: {type: string}
              title: {type: string}
              explanation: {type: string}
              evidenceIds: {type: array, items: {type: string}}
              order: {type: integer}
              supplemental: {type: boolean}
              parentStepId: {type: string, nullable: true}
              createdAt: {type: string, format: date-time}
              orchestration: {$ref: '#/components/schemas/StudyroomOrchestration'}
              resources:
                type: array
                items:
                  type: object
                  required: [type, id, title, description, parameters, available]
                  properties:
                    type: {type: string, description: Lowercase wire resource type}
                    id: {type: string}
                    title: {type: string}
                    description: {type: string}
                    parameters: {type: object, additionalProperties: true}
                    available: {type: boolean}
        messages:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              role: {type: string}
              content: {type: string}
              sourceIds: {type: array, items: {type: string}}
              stepId: {type: string, nullable: true}
              createdAt: {type: string, format: date-time}
    ApiError:
      type: object
      required: [code, message, requestId, details]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
        details:
          type: array
          items: {type: string}
    RequestCodeRequest:
      type: object
      required: [email, purpose]
      properties:
        email: {type: string, format: email}
        purpose: {type: string, enum: [register, reset]}
    VerificationCodeDelivery:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Generic response. The verification code is delivered out of band and is never returned by HTTP.
    RegisterRequest:
      type: object
      required: [email, code, password]
      properties:
        email: {type: string, format: email}
        username:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9_]{3,32}$'
          description: Optional public account identifier. Case is preserved for display and compared case-insensitively.
        code: {type: string, minLength: 6, maxLength: 6}
        password: {type: string, minLength: 8, maxLength: 128}
    LoginRequest:
      type: object
      required: [password]
      oneOf:
        - required: [email]
        - required: [username]
      properties:
        email:
          type: string
          maxLength: 254
          description: Backward-compatible login identifier field. It accepts either an email address or a username.
        username:
          type: string
          pattern: '^[A-Za-z0-9_]{3,32}$'
          description: Explicit username login field. Supply this or email, not both.
        password: {type: string, maxLength: 128}
    ResetPasswordRequest:
      type: object
      required: [email, code, password]
      properties:
        email: {type: string, format: email}
        code: {type: string, minLength: 6, maxLength: 6}
        password: {type: string, minLength: 8, maxLength: 128}
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: {type: string}
        user: {$ref: '#/components/schemas/User'}
    ClassroomBookmarkRequest:
      type: object
      required: [sessionId, stepIndex]
      properties:
        sessionId: {type: string, minLength: 1, maxLength: 64}
        stepIndex: {type: integer, minimum: 0}
    PersonalCourse:
      type: object
      required: [id, title, status, roomId, runId, totalPoints, completedPoints, readableFragments, lastPointTitle, lastLearningAt, activityAt]
      properties:
        id: {type: string}
        title: {type: string, maxLength: 160}
        status: {type: string, enum: [DRAFT, PREPARING, LEARNING, COMPLETED, NEEDS_ATTENTION]}
        roomId: {type: string, nullable: true}
        runId: {type: string, nullable: true}
        totalPoints: {type: integer, minimum: 0}
        completedPoints: {type: integer, minimum: 0}
        readableFragments: {type: integer, minimum: 0}
        lastPointTitle: {type: string, nullable: true}
        lastLearningAt: {type: string, format: date-time, nullable: true}
        activityAt: {type: string, format: date-time}
    ClassroomBookmark:
      type: object
      required: [id, sessionId, lessonId, lessonTitle, chapterId, stepIndex, slideId, title, createdAt]
      properties:
        id: {type: integer, format: int64}
        sessionId: {type: string}
        lessonId: {type: string}
        lessonTitle: {type: string}
        chapterId: {type: string}
        stepIndex: {type: integer, minimum: 0}
        slideId:
          type: string
          description: The courseware page that step showed; empty when the lesson has no courseware for it.
        title: {type: string}
        createdAt: {type: string, format: date-time}
    User:
      type: object
      required: [id, email, roles]
      properties:
        id: {type: integer, format: int64}
        email: {type: string, format: email}
        username:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9_]{3,32}$'
        roles:
          type: array
          items: {type: string, enum: [STUDENT, TEACHER, ADMIN]}
    Chapter:
      type: object
      required: [id, chapterNumber, title, summary]
      properties:
        id: {type: string}
        chapterNumber: {type: integer}
        title: {type: string}
        summary: {type: string}
    Resource:
      type: object
      required: [id, chapterId, type, title, description, sourceName, versionLabel, reviewStatus, licenseScope]
      properties:
        id: {type: string}
        chapterId: {type: string}
        type: {type: string}
        title: {type: string}
        description: {type: string}
        sourceName: {type: string}
        versionLabel: {type: string}
        reviewStatus: {type: string, enum: [PUBLISHED]}
        licenseScope: {type: string, enum: [PUBLIC, TEAM_ONLY, CLASSROOM_ONLY]}
        contentUrl:
          type: string
          nullable: true
          description: Stable API URL for the reviewed file; never a server filesystem path.
    KnowledgeSearchResponse:
      type: object
      required: [ok, query, results]
      properties:
        ok: {type: boolean, enum: [true]}
        query: {type: string, maxLength: 500}
        results:
          type: array
          maxItems: 6
          items: {$ref: '#/components/schemas/KnowledgeSearchResult'}
    KnowledgeSearchResult:
      type: object
      required:
        - id
        - chapterId
        - title
        - lessonNumber
        - kind
        - source
        - pageLabel
        - sourceLabel
        - locationLabel
        - reviewStatus
        - publicationStatus
        - excerpt
        - score
      properties:
        id: {type: string}
        chapterId: {type: string, nullable: true}
        title: {type: string}
        lessonNumber:
          type: string
          nullable: true
          description: Compatibility alias of chapterId in the current adapter.
        kind: {type: string, enum: [answer, textbook]}
        source:
          type: string
          description: Safe source label; unsafe absolute paths are reduced to a basename.
        pageLabel: {type: string, nullable: true}
        sourceLabel:
          type: string
          description: Display source label; currently mirrors source.
        locationLabel:
          type: string
          description: Page label when present, otherwise the chapter identifier.
        reviewStatus: {type: string, enum: [已审核]}
        publicationStatus: {type: string, enum: [PUBLISHED]}
        excerpt: {type: string, maxLength: 361}
        score: {type: number, format: double, minimum: 0}
    ChatTurn:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant]}
        content: {type: string, maxLength: 4000}
    ChatRequest:
      type: object
      required: [prompt]
      properties:
        prompt: {type: string, maxLength: 4000}
        chapterId: {type: string, maxLength: 64}
        sessionId: {type: string, maxLength: 64}
        history:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/ChatTurn'}
    ChatSource:
      type: object
      required: [id, chapterId, title, content, source, score, evidenceHash]
      properties:
        id: {type: string}
        chapterId: {type: string}
        title: {type: string}
        content: {type: string, maxLength: 500}
        source: {type: string}
        pageLabel: {type: string, nullable: true}
        score: {type: number, format: double}
        evidenceHash:
          type: string
          minLength: 1
          description: Hash bound to the source content or version used for this evidence result.
    ChatResponse:
      type: object
      required: [answer, sources, persisted]
      properties:
        answer: {type: string}
        sessionId: {type: string, nullable: true}
        sources:
          type: array
          items: {$ref: '#/components/schemas/ChatSource'}
        persisted: {type: boolean}
    ChatSessionSummary:
      type: object
      required: [id, title, updatedAt, messageCount]
      properties:
        id: {type: string}
        chapterId: {type: string, nullable: true}
        title: {type: string}
        updatedAt: {type: string, format: date-time}
        messageCount: {type: integer, format: int64}
    ChatMessage:
      type: object
      required: [id, role, content, sources, createdAt]
      properties:
        id: {type: integer, format: int64}
        role: {type: string, enum: [user, assistant]}
        content: {type: string}
        sources:
          type: array
          items: {$ref: '#/components/schemas/ChatSource'}
        createdAt: {type: string, format: date-time}
    ChatSession:
      type: object
      required: [id, title, updatedAt, messages]
      properties:
        id: {type: string}
        chapterId: {type: string, nullable: true}
        title: {type: string}
        updatedAt: {type: string, format: date-time}
        messages:
          type: array
          maxItems: 200
          description: Latest persisted messages, returned in chronological order
          items: {$ref: '#/components/schemas/ChatMessage'}
    ClassroomLesson:
      type: object
      required: [id, chapterId, title, source]
      properties:
        id: {type: string}
        chapterId: {type: string}
        title: {type: string}
        source: {type: string}
        pages: {type: string, nullable: true}
    ClassroomPreparation:
      type: object
      required: [id, state, phase]
      properties:
        id: {type: string}
        state: {type: string, enum: [preparing, ready, failed]}
        phase: {type: string}
        error: {type: string, nullable: true}
        session:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClassroomSession'
    ClassroomScript:
      type: object
      required: [id, chapterId, title, versionLabel]
      properties:
        id: {type: string}
        chapterId: {type: string}
        title: {type: string}
        versionLabel: {type: string}
    ClassroomSession:
      type: object
      required: [id, userId, scriptId, state, paused, stage]
      properties:
        id: {type: string}
        userId: {type: integer, format: int64}
        scriptId: {type: string}
        state:
          type: string
          enum: [OPENING, EXPLAIN, QUESTION, WAITING, DISCUSS, BLACKBOARD, SUMMARY]
        paused: {type: boolean}
        summary: {type: string, nullable: true}
        stage: {type: object, additionalProperties: true}
        answerEvaluation:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClassroomAnswerEvaluation'
    ClassroomAnswerEvaluation:
      type: object
      required: [status, feedback]
      properties:
        status: {type: string, enum: [CORRECT, MISCONCEPTION, INCORRECT]}
        misconception: {type: string, nullable: true}
        feedback: {type: string}
    AnimationStep:
      type: object
      required: [op, label, note]
      properties:
        op: {type: string, maxLength: 32}
        label: {type: string, maxLength: 48}
        note: {type: string, maxLength: 240}
        value:
          oneOf:
            - {type: string, maxLength: 48}
            - {type: number}
            - {type: boolean}
            - {type: object, nullable: true, enum: [null]}
        index: {type: integer, minimum: 0, maximum: 1024, nullable: true}
        node: {type: integer, minimum: 0, maximum: 64, nullable: true}
        i: {type: integer, minimum: 0, maximum: 1024, nullable: true}
        j: {type: integer, minimum: 0, maximum: 1024, nullable: true}
        key: {type: string, maxLength: 48, nullable: true}
        val: {type: string, maxLength: 48, nullable: true}
        state:
          type: array
          nullable: true
          readOnly: true
          items: {}
          description: Exact step snapshot from deterministic local execution; not accepted from model-generated definitions.
    AnimationDefinition:
      type: object
      required: [animation, type, title, description, initial, steps]
      properties:
        animation: {type: boolean, enum: [true]}
        type: {type: string, enum: [stack, list, tree, queue, heap, hash, array]}
        title: {type: string, maxLength: 60}
        description: {type: string, maxLength: 240}
        initial:
          type: array
          maxItems: 64
          items: {}
        steps:
          type: array
          minItems: 1
          maxItems: 256
          description: Deterministic DSVP output may contain up to 256 steps; untrusted model-generated definitions remain limited to 20.
          items: {$ref: '#/components/schemas/AnimationStep'}
    AnimationResponse:
      type: object
      required: [definition, persisted]
      properties:
        definition: {$ref: '#/components/schemas/AnimationDefinition'}
        recordId: {type: string, nullable: true}
        persisted: {type: boolean}
    DsvpRequest:
      type: object
      required: [version, structure, operation, params, initial_state]
      additionalProperties: false
      properties:
        version: {type: string, enum: ['1.0']}
        structure:
          type: string
          enum: [stack, queue, sequential_list, linked_list, tree, graph, heap, hash, array]
        operation: {type: string, minLength: 1, maxLength: 32}
        params: {type: object, additionalProperties: true}
        initial_state:
          type: object
          required: [data]
          properties:
            data: {type: array, maxItems: 64, items: {}}
            metadata: {type: object, additionalProperties: true}
        options: {type: object, additionalProperties: true}
        context: {$ref: '#/components/schemas/DsvpEvidenceContext'}
        chapter_id: {type: string, maxLength: 64, description: Compatibility alias for context.chapter_id}
        chapterId: {type: string, maxLength: 64, description: Compatibility alias for context.chapter_id}
        lesson_id: {type: string, maxLength: 160}
        lessonId: {type: string, maxLength: 160}
        presentation_id: {type: string, maxLength: 160}
        presentationId: {type: string, maxLength: 160}
        presentation_page_id: {type: string, maxLength: 160}
        presentationPageId: {type: string, maxLength: 160}
        classroom_session_id: {type: string, maxLength: 160}
        classroomSessionId: {type: string, maxLength: 160}
        source_ref: {type: string, maxLength: 160}
    DsvpPlanResolution:
      type: object
      required: [status, missingArguments]
      description: >-
        Outcome of asking the local engine to turn a chosen capability into a request. `ready` carries
        toolRequest; `missing-arguments`, `invalid-arguments`, `unsupported`, `not-needed` and
        `low-confidence` carry the reason instead.
      properties:
        status:
          type: string
          enum: [ready, not-needed, low-confidence, missing-arguments, invalid-arguments, unsupported]
        capability:
          type: object
          nullable: true
          additionalProperties: true
          description: The engine's catalog entry for the chosen capability, when it recognised it.
        missingArguments:
          type: array
          items: {type: string}
        error: {type: string, nullable: true}
        toolRequest:
          type: object
          nullable: true
          required: [kind, protocol, capability, request]
          properties:
            kind: {type: string, enum: [animation]}
            protocol: {type: string, example: 'dsvp/1'}
            capability: {type: string, example: 'bst.insert'}
            purpose: {type: string, maxLength: 240}
            confidence: {type: number, minimum: 0, maximum: 1}
            sourceChunkIds:
              type: array
              items: {type: string}
            demoFallback:
              type: boolean
              description: True when required arguments were missing and the engine supplied its canonical teaching example.
            request: {$ref: '#/components/schemas/DsvpRequest'}
    DsvpEvidenceContext:
      type: object
      additionalProperties: false
      properties:
        chapter_id: {type: string, maxLength: 64}
        lesson_id: {type: string, maxLength: 160}
        presentation_id: {type: string, maxLength: 160}
        presentation_page_id: {type: string, maxLength: 160}
        classroom_session_id: {type: string, maxLength: 160}
        source_type: {type: string, enum: [API, CLASSROOM, PPT]}
        source_ref: {type: string, maxLength: 160}
    DsvpSimulationResponse:
      type: object
      required: [protocol, request, trace, animationData, evidencePersisted, matchSource]
      properties:
        protocol: {type: string, enum: [dsvp/1.0]}
        request: {$ref: '#/components/schemas/DsvpRequest'}
        trace: {type: object, additionalProperties: true}
        animationData: {$ref: '#/components/schemas/AnimationDefinition'}
        recordId:
          type: string
          nullable: true
          description: Compatibility alias for animationRecordId; absent for a preview.
        evidencePersisted:
          type: boolean
          description: True only when animation, snapshot, and learning event committed together.
        animationRecordId: {type: string, nullable: true}
        resolvedChapterId: {type: string, maxLength: 64, nullable: true}
        matchSource:
          type: string
          enum: [NONE, CLASSROOM_SESSION, PRESENTATION_PAGE, EXPLICIT_CHAPTER, ANIMATION_DEFINITION]
    AnimationObservationRequest:
      type: object
      required: [observation]
      properties:
        observation: {type: string, minLength: 1, maxLength: 2000}
    AnimationObservation:
      type: object
      required: [recordId, observation]
      properties:
        recordId: {type: string}
        observation: {type: string}
    CodeRunRequest:
      type: object
      required: [language, code]
      properties:
        language: {type: string, enum: [c, python]}
        code: {type: string}
        stdin: {type: string}
        chapterId: {type: string, maxLength: 64}
    CodeRunResponse:
      type: object
      required: [language, status, stdout, stderr, durationMs]
      properties:
        language: {type: string, enum: [c, python]}
        status: {type: string, enum: [success, compile_error, runtime_error]}
        stdout: {type: string}
        stderr: {type: string}
        durationMs: {type: integer, format: int64}
        runId:
          type: string
          nullable: true
          description: Persisted run identifier for a signed-in user; null for a guest run.
    CodeAnalysisRequest:
      oneOf:
        - title: Analyze an owned persisted run
          type: object
          required: [runId]
          properties:
            runId: {type: string, minLength: 1, maxLength: 64}
          description: Other run fields may be sent for compatibility but are ignored by the server.
        - title: Analyze ad-hoc code
          type: object
          required: [language, code]
          properties:
            runId:
              type: string
              nullable: true
              enum: [null]
              description: Omit this field or send null for ad-hoc analysis.
            language: {type: string, enum: [c, python]}
            code: {type: string}
            stdin: {type: string}
            stdout: {type: string}
            stderr: {type: string}
            status: {type: string, enum: [success, compile_error, runtime_error, unknown]}
            chapterId: {type: string, maxLength: 64}
    ChapterProgress:
      type: object
      required:
        - chapterId
        - chapterNumber
        - title
        - chatCount
        - classroomCount
        - animationCount
        - codeRunCount
        - eventCount
        - totalActivities
      properties:
        chapterId: {type: string}
        chapterNumber: {type: integer}
        title: {type: string}
        chatCount: {type: integer, format: int64}
        classroomCount: {type: integer, format: int64}
        animationCount: {type: integer, format: int64}
        codeRunCount: {type: integer, format: int64}
        eventCount: {type: integer, format: int64}
        totalActivities: {type: integer, format: int64}
        lastActivityAt: {type: string, format: date-time, nullable: true}
    LearningProgress:
      type: object
      required: [totalActivities, chapters]
      properties:
        totalActivities: {type: integer, format: int64}
        chapters:
          type: array
          items: {$ref: '#/components/schemas/ChapterProgress'}
    PersistedWorkbenchScene:
      type: object
      required: [recordId, chapterId, definition]
      properties:
        recordId: {type: string}
        chapterId: {type: string}
        definition: {$ref: '#/components/schemas/AnimationDefinition'}
        updatedAt: {type: string, format: date-time, nullable: true}
    LearningWorkbench:
      type: object
      required: [progress]
      properties:
        currentChapterId: {type: string, nullable: true}
        progress: {$ref: '#/components/schemas/LearningProgress'}
        scene:
          allOf:
            - {$ref: '#/components/schemas/PersistedWorkbenchScene'}
          nullable: true
    LearningEventRequest:
      type: object
      required: [eventType]
      properties:
        eventType:
          type: string
          description: Classroom answers, animation observations, and code reviews are recorded only by their domain endpoints.
          enum: [RESOURCE_VIEW, RESOURCE_DOWNLOAD, REVIEW_COMPLETED, WEAKNESS_RECORDED]
        chapterId: {type: string, maxLength: 64, nullable: true}
        referenceId: {type: string, maxLength: 96, nullable: true}
        payload: {type: object, additionalProperties: true, nullable: true}
    LearningEvent:
      type: object
      required: [id, eventType, createdAt]
      properties:
        id: {type: integer, format: int64}
        eventType: {type: string}
        chapterId: {type: string, nullable: true}
        referenceId: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    AiReadiness:
      type: object
      required:
        - operation
        - evidenceRequired
        - modelAvailable
        - modelReason
        - evidenceAvailable
        - currentContext
        - availableResourceCount
        - availableKnowledgeChunkCount
        - availableSourceCount
        - excludedOrUnverifiedCount
        - quotaStatus
        - allowFormalGeneration
        - blockingReasons
      properties:
        operation:
          type: string
          enum: [CHAT, CODE_ANALYSIS, ANIMATION_GENERATION]
          description: Canonical operation selected by the optional readiness query parameter; defaults to CHAT.
        evidenceRequired:
          type: boolean
          description: True only when the selected operation requires reviewed, audience-visible evidence before formal generation.
        modelAvailable: {type: boolean}
        modelReason:
          type: string
          enum:
            - PERSISTED_CONFIGURATION_READY
            - PERSISTED_CONFIGURATION_DISABLED
            - PERSISTED_QUOTA_NOT_CONFIGURED
            - PERSISTED_CONFIGURATION_UNAVAILABLE
            - ENVIRONMENT_CONFIGURATION_READY
            - ENVIRONMENT_QUOTA_NOT_CONFIGURED
            - ENVIRONMENT_CONFIGURATION_INCOMPLETE
        evidenceAvailable: {type: boolean}
        evidenceReason:
          type: string
          nullable: true
          enum: [QUESTION_EVIDENCE_UNAVAILABLE, CONTEXT_EVIDENCE_UNAVAILABLE]
        currentContext: {$ref: '#/components/schemas/AiCurrentContext'}
        availableResourceCount: {type: integer, minimum: 0}
        availableKnowledgeChunkCount: {type: integer, minimum: 0}
        availableSourceCount: {type: integer, minimum: 0}
        excludedOrUnverifiedCount: {type: integer, minimum: 0}
        remainingDailyTokenQuota:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Null when the caller is not eligible for an active configured quota; otherwise the current server-side reservation ledger balance.
        quotaStatus:
          type: string
          description: A controlled quota capability state derived from the atomic reservation ledger.
          enum: [NOT_CONFIGURED, AVAILABLE, EXHAUSTED, CONCURRENCY_LIMITED]
        allowFormalGeneration: {type: boolean}
        blockingReasons:
          type: array
          items: {type: string}
    AiCurrentContext:
      type: object
      required: [chapterId, queryScoped]
      properties:
        chapterId: {type: string, maxLength: 64, nullable: true}
        queryScoped: {type: boolean}
    AdminCapability:
      type: object
      required: [userId, roles, modules, service]
      properties:
        userId: {type: integer, format: int64}
        roles:
          type: array
          items: {type: string, enum: [STUDENT, TEACHER, ADMIN]}
        modules:
          type: object
          additionalProperties: {$ref: '#/components/schemas/AdminModuleCapability'}
          description: Includes users, audit, reviewQueue, backgroundTasks, modelSettings, mailSettings, and sandboxSettings.
        service: {$ref: '#/components/schemas/AdminServiceStatus'}
    AdminModuleCapability:
      type: object
      required: [available, status]
      properties:
        available: {type: boolean}
        status: {type: string, enum: [AVAILABLE, UNAVAILABLE, NOT_CONFIGURED]}
        reason: {type: string, nullable: true}
    AdminServiceStatus:
      type: object
      required: [name, version, status]
      properties:
        name: {type: string, enum: [spring]}
        version: {type: string}
        status: {type: string, enum: [AVAILABLE, UNAVAILABLE]}
    AdminUser:
      type: object
