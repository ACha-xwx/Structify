    post:
      tags: [Animation]
      summary: Use the model to select a deterministic DSVP request for a published chapter
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chapterId]
              properties:
                chapterId: {type: string, minLength: 1, maxLength: 64}
